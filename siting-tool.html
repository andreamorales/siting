<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TerraSite · Co-Siting Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Sora:wght@400;500;600;700;800&family=Saira+Condensed:wght@400;500;600;700&family=Spline+Sans+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #F4F5F5; }
  * { -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx?v=12"></script>
<script type="text/babel" src="shared.jsx?v=15"></script>
<script type="text/babel" src="v1.jsx?v=17"></script>
<script type="text/babel" src="v2.jsx?v=16"></script>
<script type="text/babel" src="v4.jsx?v=15"></script>

<script type="text/babel" data-presets="react">
  // DesignCanvas / DCSection / DCArtboard (from design-canvas.jsx) and the five
  // V* components (from v1-v5.jsx) are top-level globals — used directly.

  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="siting"
          title="Co-Siting Analysis · Site Detail"
          subtitle="Three directions × light & dark — nuclear × datacenter co-siting. Drag to reorder, click any to open fullscreen.">
          <DCArtboard id="v1l" label="V1 · Editorial Mono — Light" width={1440} height={900}><VEditorial /></DCArtboard>
          <DCArtboard id="v1d" label="V1 · Editorial Mono — Dark" width={1440} height={900}><VEditorial dark /></DCArtboard>
          <DCArtboard id="v2l" label="V2 · Status Console — Light" width={1440} height={900}><VConsole /></DCArtboard>
          <DCArtboard id="v2d" label="V2 · Status Console — Dark" width={1440} height={900}><VConsole dark /></DCArtboard>
          <DCArtboard id="v4l" label="V4 · Orange Ops — Light" width={1440} height={900}><VOrange /></DCArtboard>
          <DCArtboard id="v4d" label="V4 · Orange Ops — Dark" width={1440} height={900}><VOrange dark /></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
